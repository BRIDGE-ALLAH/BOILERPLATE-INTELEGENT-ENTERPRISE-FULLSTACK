[project]
name = "moonwitness-automation"
version = "1.0.0"
description = "MoonWitness scheduling and webhook automation service"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11,<4",
    "croniter>=6.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
